name: Engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: SQLite runtime version before dependency setup
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - name: Provide SQLite >= 3.42 where the bundled runtime is older
        shell: python
        run: |
          import sqlite3, subprocess, sys
          if sqlite3.sqlite_version_info < (3, 42, 0):
              print('Bundled SQLite', sqlite3.sqlite_version, 'is too old; installing pysqlite3')
              subprocess.run([sys.executable, '-m', 'pip', 'install', 'pysqlite3'], check=True)
              import pysqlite3
              print('pysqlite3 SQLite', pysqlite3.sqlite_version)
          else:
              print('Bundled SQLite', sqlite3.sqlite_version, 'already meets the requirement')
      - name: Require FTS5 secure-delete (no security downgrade)
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'memory_service')
          import store
          sqlite3 = store.sqlite3
          print('Service SQLite', sqlite3.sqlite_version)
          assert sqlite3.sqlite_version_info >= (3, 42, 0), 'memory_service requires SQLite >= 3.42'
          con = sqlite3.connect(':memory:')
          con.execute('CREATE VIRTUAL TABLE probe USING fts5(body)')
          con.execute("INSERT INTO probe(probe,rank) VALUES('secure-delete',1)")
          con.close()
      - name: Core Python regression
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=True)
      - name: Memory service regression (separate import namespace)
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'memory_service/tests', '-v'], check=True)
      - run: npm test
      - name: Fixed negative-memory controls (offline)
        run: node benchmark/longmemeval/negative_samples.mjs
      - name: Frozen evaluation integrity (offline)
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'benchmark/longmemeval/freeze.py', '--verify'], check=True)
      - name: Offline demo
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'demo/run_demo.py', '--offline'], check=True)
      - name: Secret scan
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'tools/secret_scan.py'], check=True)
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.11.13
      - run: ruff check .
      - run: ruff format --check .
      - run: python tools/secret_scan.py --history
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3 (Node 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
